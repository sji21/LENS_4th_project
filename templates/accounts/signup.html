{% extends 'base.html' %}
{% load static %}
{% block title %}회원가입 · LENS{% endblock %}
{% block head %}<link rel="stylesheet" href="{% static 'cases/app.css' %}">{% endblock %}
{% block content %}
<main class="auth-shell">
  <section class="auth-card">
    <a class="brand" href="{% url 'chat:home' %}"><span class="brand-mark">L</span><span>LENS</span></a>
    <h1>계약 관리 시작하기</h1>
    <p>가입 후 계약 케이스를 만들면 다른 기기에서도 상담을 이어볼 수 있습니다.</p>
    <form method="post" class="stack-form">{% csrf_token %}{{ form.as_p }}<button class="primary-button" type="submit">회원가입</button></form>
    <p class="auth-link">이미 계정이 있나요? <a href="{% url 'accounts:login' %}">로그인</a></p>
  </section>
</main>
{% endblock %}
